<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Merchant Registration</h1>

<!-- Form đăng ký Merchant -->
<form action="/merchant/register" method="POST" enctype="multipart/form-data">
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" th:value="${merchantForm.name}" required/>
    </div>

    <div>
        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" th:value="${merchantForm.phone}" required/>
    </div>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" th:value="${merchantForm.email}" required/>
    </div>

    <div>
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" th:value="${merchantForm.address}" required/>
    </div>

    <div>
        <label for="slogan">Slogan:</label>
        <input type="text" id="slogan" name="slogan" th:value="${merchantForm.slogan}" required/>
    </div>

    <div>
        <label for="avatarImage">Avatar Image:</label>
        <input type="file" id="avatarImage" name="avatarImage" accept="image/*"/>
    </div>

    <div>
        <button type="submit">Register</button>
    </div>
    <a href="/user">Back to user</a>
</form>
</body>
</html>
