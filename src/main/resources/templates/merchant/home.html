<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Home</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body setup */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Style */
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        /* Logout button positioned in the top-right corner */
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: #ff3333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .logout-btn:hover {
            background-color: #cc0000;
        }

        /* Main content */
        main {
            flex-grow: 1;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Footer Style */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }

        /* Card Styling */
        .card {
            margin-top: 20px;
        }

        /* Avatar image */
        .avatar-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Buttons */
        .btn-primary {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #45a049;
        }

        /* Product and registration links */
        .btn-links {
            margin-top: 10px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
        }

        .btn-links:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<header>
    <h1>Merchant Home</h1>
    <!-- Logout button -->
    <a href="/logout" class="logout-btn">Logout</a>
</header>

<main>
    <div class="container">
        <h2 class="text-center">Welcome, <span th:text="${merchant.name}">Merchant Name</span>!</h2>

        <div class="card">
            <div class="card-header">
                <h4>Your Information</h4>
            </div>
            <div class="card-body">
                <ul>
                    <li><strong>Name:</strong> <span th:text="${merchant.name}">Merchant Name</span></li>
                    <li><strong>Email:</strong> <span th:text="${merchant.email}">merchant@example.com</span></li>
                    <li><strong>Phone:</strong> <span th:text="${merchant.phone}">123456789</span></li>
                    <li><strong>Address:</strong> <span th:text="${merchant.address}">Some Address</span></li>
                    <li><strong>Slogan:</strong> <span th:text="${merchant.slogan}">Best Merchant Ever</span></li>
                </ul>

<!--                <h5>Avatar:</h5>-->
<!--                <img th:src="@{'/uploads/images/' + ${merchantForm.avatarImage}}" alt="Avatar" class="avatar-img">-->
            </div>
        </div>

        <div class="mt-3">
            <a href="/merchant/register" class="btn-links">Back to Registration</a>
            <a href="/products" class="btn-links">Products</a>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2025 Merchant Dashboard. All rights reserved.</p>
</footer>

</body>
</html>
