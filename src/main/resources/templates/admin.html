<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        /* Reset some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body setup with Flexbox for vertical alignment */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f4f4;
        }

        /* Header Style */
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            position: relative; /* Added to position logout button */
        }

        /* Logout button style */
        header a.logout {
            position: absolute;
            right: 20px; /* Move the logout button to the right */
            top: 20px; /* Align the button to the top */
            padding: 10px 15px;
            background-color: #f44336;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        header a.logout:hover {
            background-color: #e53935; /* Darker shade when hovered */
        }

        /* Main section to center content */
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            padding: 20px;
            text-align: center;
        }

        /* Footer Style */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }

        /* Links Style */
        a {
            margin: 10px;
            padding: 10px;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #45a049;
        }

    </style>
</head>
<body>

<header>
    <h1>ADMIN BA CON CHÓ</h1>

    <!-- Logout Button positioned at the top-right -->
    <a href="/logout" class="logout">Logout</a>
</header>

<main>
    <!-- Main content section with two links, centered -->
    <div>
        <a href="admin/listuser">Quản lý người dùng</a>
        <a href="products/create">Thêm sản phẩm</a>
    </div>
</main>

<footer>
    <p>&copy; 2025 Admin Dashboard. All rights reserved.</p>
</footer>

</body>
</html>
