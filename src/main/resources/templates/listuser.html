<!-- src/main/resources/templates/user.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
</head>
<body>
<h1>List of Users</h1>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>username</th>
        <th>name</th>
        <th>Address</th>
        <th>Phone</th>
        <th></th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="customer : ${list}">
        <td th:text="${customer.id}"></td>
        <td th:text="${customer.appUser != null ? customer.appUser.username : 'No Username'}"></td>
        <td th:text="${customer.name}"></td>
        <td th:text="${customer.getAddress()}"></td>
        <td th:text="${customer.getPhone()}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
