<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách cửa hàng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f8f9fa;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        a {
            text-decoration: none;
            padding: 8px 12px;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        a:hover {
            background-color: #218838;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        td img {
            border-radius: 5px;
        }

        td .no-image {
            color: #6c757d;
            font-style: italic;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #dc3545;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn-back:hover {
            background-color: #c82333;
        }

        header {
            display: flex;
            justify-content: space-between; /* Tiêu đề bên trái, user-info bên phải */
            align-items: center;
            padding: 15px 20px;
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px; /* Khoảng cách giữa các phần tử */
        }

        .username {
            font-weight: bold;
            font-size: 16px;
        }

        .user-info a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s ease-in-out;
        }

        .change-password {
            background-color: #ff9800;
            color: white;
        }

        .change-password:hover {
            background-color: #e68900;
        }

        .logout {
            background-color: #d32f2f;
            color: white;
        }

        .logout:hover {
            background-color: #b71c1c;
        }
    </style>
</head>
<body>

<header>
    <h1>ADMIN SITE</h1>
    <div class="user-info">
        <div class="user-info">
            <span>Good day:
                <span th:text="${#authentication.name}"></span>
            </span>
            <a href="/change-password" class="change-password">Đổi mật khẩu</a>
            <a href="/logout" class="logout">Logout</a>
        </div>
    </div>
</header>

<h1>Danh sách Cửa Hàng</h1>

<!-- Nút thêm mới cửa hàng -->
<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
    <a href="/admin/new-merchant"> Thêm cửa hàng mới</a>
</div>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên Cửa Hàng</th>
        <th>Số Điện Thoại</th>
        <th>Email</th>
        <th>Địa Chỉ</th>
        <th>Slogan</th>
        <th>Ảnh Đại Diện</th>
        <th>Hành Động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="shop : ${shopList}">
        <td th:text="${shop.id}"></td>
        <td th:text="${shop.name}"></td>
        <td th:text="${shop.phone}"></td>
        <td th:text="${shop.email}"></td>
        <td th:text="${shop.address}"></td>
        <td th:text="${shop.slogan}"></td>

        <td>
        </td>
    </tr>
    </tbody>
</table>

<a href="/admin">Quay lại</a>

</body>
</html>
