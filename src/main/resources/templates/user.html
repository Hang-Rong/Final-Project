<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <style>
        /* Reset some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body setup with Flexbox for vertical alignment */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f4f4;
        }


        /* Main section to center content */
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            padding: 20px;
            text-align: center;
        }

        /* Footer Style */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }

        /* Table Style */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: white;
        }

        table th, table td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        table th {
            background-color: #4CAF50;
            color: white;
        }

        /* Links Style */
        a {
            text-decoration: none;
            color: white;
            padding: 10px 20px;
            background-color: #4CAF50;
            border-radius: 5px;
            margin: 5px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #45a049;
        }

        header {
            display: flex;
            justify-content: space-between; /* Tiêu đề bên trái, user-info bên phải */
            align-items: center;
            padding: 15px 20px;
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px; /* Khoảng cách giữa các phần tử */
        }

        .username {
            font-weight: bold;
            font-size: 16px;
        }

        .user-info a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s ease-in-out;
        }

        .change-password {
            background-color: #ff9800;
            color: white;
        }

        .change-password:hover {
            background-color: #e68900;
        }

        .logout {
            background-color: #d32f2f;
            color: white;
        }

        .logout:hover {
            background-color: #b71c1c;
        }

    </style>
</head>
<body>

<header>
    <h1>WELCOME</h1>
    <div class="user-info">
        <div class="user-info">
            <span>Good day:
                <span th:text="${#authentication.name}"></span>
            </span>
            <a href="/change-password" class="change-password">Đổi mật khẩu</a>
            <a href="/logout" class="logout">Logout</a>
        </div>
    </div>
</header>

<main>
    <div>
        <a href="categories/list">DANH SÁCH SẢN PHẨM</a>
        <a href="merchant/register">ĐĂNG KÍ CỬA HÀNG</a>
<!--        <a href="user/request-form"> dang ki kinh doanh</a>-->

    </div>
</main>

<footer>
    <p>&copy; 2025 All rights reserved.</p>
</footer>

</body>
</html>
