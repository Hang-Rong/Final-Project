<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <style>
        /* Reset some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body setup with Flexbox for vertical alignment */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #fff9f0; /* Màu cam nhạt nền */
        }

        /* Header Style */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #ff6f00; /* Màu cam Tết */
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .username {
            font-weight: bold;
            font-size: 16px;
        }

        .user-info a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s ease-in-out;
            color: white;
        }

        .change-password {
            background-color: #f44336; /* Màu đỏ cho nút Đổi mật khẩu */
        }

        .change-password:hover {
            background-color: #d32f2f;
        }

        .logout {
            background-color: #4caf50; /* Màu xanh lá cho nút Logout */
        }

        .logout:hover {
            background-color: #388e3c;
        }

        /* Menu container with festive styling */
        .menu-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .menu-item {
            background: linear-gradient(135deg, #ff9800, #ff5722); /* Gradient cam và đỏ */
            border-radius: 12px;
            margin: 12px;
            width: 270px;
            text-align: center;
            padding: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
            color: white;
        }

        .menu-item:hover {
            transform: translateY(-5px); /* Hover effect */
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.2); /* Enhanced shadow on hover */
        }

        .menu-item a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: 600;
            display: block;
            transition: color 0.3s ease;
        }

        .menu-item a:hover {
            color: #ffeb3b; /* Màu vàng khi hover vào link */
        }

        .menu-item i {
            font-size: 28px;
            margin-bottom: 10px;
            color: #fff;
            transition: transform 0.3s ease;
        }

        .menu-item:hover i {
            transform: scale(1.2); /* Zoom icon khi hover */
        }

        /* Icon Style - Using Font Awesome */
        .fas {
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
        }

        /* Footer Style */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 14px;
        }

        footer p {
            font-size: 16px;
        }

    </style>
</head>
<body>

<header>
    <h1>WELCOME</h1>

    <div class="user-info">
        <span>Good day: <span th:text="${#authentication.name}"></span></span>
        <a href="/change-password" class="change-password">Đổi mật khẩu</a>
        <a href="/logout" class="logout">Logout</a>
    </div>
</header>

<main>
    <div class="menu-container">
        <div class="menu-item">
            <i class="fas fa-box-open"></i>
            <a href="categories/list">DANH SÁCH SẢN PHẨM</a>
        </div>
        <div class="menu-item">
            <i class="fas fa-clipboard-list"></i>
            <a href="request-form">YÊU CẦU CẤP PHÉP KINH DOANH</a>
        </div>
        <div class="menu-item">
            <i class="fas fa-store"></i>
            <a href="merchant/register">ĐĂNG KÍ CỬA HÀNG</a>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2025 All rights reserved.</p>
</footer>

</body>
</html>
