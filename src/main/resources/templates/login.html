<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }

        .left-section {
            flex: 1;
            background: url('https://www.dispatch.com/gcdn/presto/2022/11/02/NCOD/6447d5b8-b95f-4c00-809f-0293368f3c2d-News-_CEB_BJs_Wholesale_Opening_01.jpg?crop=3592,2694,x480,y0') no-repeat center center/cover;
        }

        .right-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        .login-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .login-container input {
            padding: 10px;
            width: 100%;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-container button {
            padding: 10px;
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #0056b3;
        }
        footer {
            width: 100%;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px 0;
            position: absolute;
            bottom: 0;
        }

        footer section {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="left-section"></div>
<div class="right-section">
    <div class="login-container">
        <h2>Login</h2>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="Username or Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <br>
        <p><a href="/forgot-password">Lost your password?</a></p>
        <a href="register"> Đăng kí</a>
    </div>
</div>

<footer>
    <p>&copy; 2025 Hold Sell Shop. All rights reserved.</p>
    <section>
        <a href="/complaint">Contact us</a>
    </section>
</footer>

</body>
</html>
