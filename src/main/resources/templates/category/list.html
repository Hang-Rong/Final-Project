<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách danh mục</title>
    <style>
        /* Thêm hiệu ứng xuất hiện */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hiệu ứng hover */
        @keyframes bounce {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* Container chứa danh mục */
        .category-list-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: flex-start;
        }

        /* Ô danh mục */
        .category-item {
            width: 200px;
            height: 200px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #ff6600;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 18px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            animation: fadeIn 0.8s ease-in-out; /* Hiệu ứng fade-in */
        }

        /* Hover - hiệu ứng nhảy nhẹ */
        .category-item:hover {
            animation: bounce 0.5s ease-in-out;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Liên kết trong ô danh mục */
        .category-item a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .category-item a:hover {
            text-decoration: underline;
        }

    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/admincss.css"/>
</head>
<body>

<div th:replace="~{fragments/userheaded :: header}"></div>

<!-- Main Content -->
<div class="main-content">
    <div class="category-list-container">
        <div th:each="category : ${categories}" class="category-item">
            <a th:href="@{/categories/products/{categoryId}(categoryId=${category.id})}" th:text="${category.name}"></a>
        </div>
    </div>
</div>

<a href="javascript:history.back(-2)">Quay về trang trước</a>




<!-- Footer -->
<div th:replace="~{fragments/userFooter :: footer}"></div>
</body>
</html>
