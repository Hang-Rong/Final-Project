<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <h1>Chi tiết sản phẩm</h1>
    <a href="/products">Quay lại danh sách sản phẩm</a>
</header>

<div class="product-details">
    <div class="product-image">
        <!-- Sử dụng th:src để hiển thị đường dẫn hình ảnh -->
        <img th:src="@{'/uploads/images/' + ${product.imageName}}" alt="Hình ảnh của ${product.name}">
    </div>

    <div class="product-info">
        <!-- Hiển thị tên sản phẩm -->
        <h2 th:text="${product.name}"></h2>

        <!-- Hiển thị giá sản phẩm -->
        <p><strong>Giá:</strong> <span th:text="${product.price}"></span> VND</p>

        <!-- Hiển thị mô tả sản phẩm -->
        <p><strong>Mô tả:</strong> <span th:text="${product.description}"></span></p>

        <!-- Hiển thị danh mục sản phẩm -->
        <p><strong>Danh mục:</strong> <span th:text="${product.category.name}"></span></p>

        <!-- Kiểm tra trạng thái sản phẩm (đã xóa hay còn bán) -->
        <p><strong>Trạng thái:</strong> <span th:text="${product.deleted ? 'Đã xóa' : 'Còn bán'}"></span></p>

        <p><strong>Số lượt đánh giá:</strong> <span th:text="${product.allReviews}">0</span></p>
        <p><strong>Điểm trung bình:</strong> <span th:text="${product.allRating}">0</span> sao</p>
    </div>
</div>

<h2>Đánh giá sản phẩm</h2>

<!-- Hiển thị điểm trung bình -->
<div th:if="${product.allReviews > 0}">
    <p><strong>Điểm trung bình:</strong>
        <span th:text="${product.allRating / product.allReviews}"></span>/5 ⭐
        (<span th:text="${product.allReviews}"></span> lượt đánh giá)
    </p>
</div>

<!-- Hiển thị các đánh giá -->
<div th:if="${reviews}">
    <ul>
        <li th:each="review : ${reviews}" th:text="${review}"></li>
    </ul>
</div>

<!-- Form nhập đánh giá -->
<form th:action="@{/reviews/review/{productId}(productId=${product.id})}" method="post">
    <h3>Gửi đánh giá của bạn</h3>

    <label for="rating">Chấm điểm (1-5):</label>
    <select id="rating" name="rating">
        <option value="1">1 ⭐</option>
        <option value="2">2 ⭐</option>
        <option value="3">3 ⭐</option>
        <option value="4">4 ⭐</option>
        <option value="5">5 ⭐</option>
    </select>
    <br>

    <label for="comment">Bình luận:</label>
    <textarea id="comment" name="comment" rows="4" required></textarea>
    <br>

    <button type="submit">Gửi đánh giá</button>
</form>

<footer>
    <p>&copy; 2025 Shop - Tất cả quyền được bảo vệ</p>
</footer>
</body>
</html>
