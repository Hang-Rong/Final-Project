<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách sản phẩm</title>
    <style>
        /* Reset default margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Setup */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        /* Container to hold products */
        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Product box style */
        .product-box {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        /* Product image */
        .product-box img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        /* Product details */
        .product-box h3 {
            margin: 10px 0;
            font-size: 18px;
            color: #333;
        }

        .product-box p {
            font-size: 14px;
            color: #777;
            margin: 10px 0;
        }

        .product-box .price {
            font-size: 16px;
            color: #4CAF50;
            margin: 5px 0;
        }

        .product-box .quantity {
            font-size: 14px;
            color: #888;
        }

        /* Buttons */
        .product-box a {
            display: inline-block;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .product-box a:hover {
            background-color: #45a049;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-container input {
            padding: 10px;
            width: 80%;
            font-size: 16px;
            margin-right: 10px;
        }

        .search-container button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .search-container button:hover {
            background-color: #45a049;
        }

        .pagination {
            margin-top: 20px;
            text-align: center;
        }

        .pagination a {
            margin: 0 5px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .pagination a:hover {
            background-color: #45a049;
        }

        /* Logout button style */
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: #ff3333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .logout-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

<h1>Danh sách sản phẩm</h1>

<!-- Logout button positioned at the top right corner -->
<a href="/logout" class="logout-btn">Logout</a>

<!-- Search form -->
<div class="search-container">
    <form action="/products/search" method="get">
        <input type="text" name="name" placeholder="Tìm kiếm sản phẩm...">
        <button type="submit">Tìm kiếm</button>
    </form>
</div>

<a href="/products/create" style="display:block; margin-bottom: 20px; padding: 10px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 5px;">Tạo sản phẩm mới</a>

<!-- Product display grid -->
<div class="product-container">
    <div th:each="product : ${products}" class="product-box">
        <img th:src="@{/uploads/images/{image}(image=${product.imageName})}" alt="Hình ảnh sản phẩm">
        <h3 th:text="${product.name}"></h3>
        <p class="price" th:text="'Giá: ' + ${product.price} + ' VNĐ'"></p>
        <p class="quantity" th:text="'Số lượng: ' + ${product.quantity}"></p>
        <p th:text="${product.description}"></p>
        <a th:href="@{/products/edit/{id}(id=${product.id})}">Chỉnh sửa</a>
        <a th:href="@{/products/delete/{id}(id=${product.id})}" onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">Xóa</a>
        <a th:href="@{/shoppingcart/ordernow/{id}(id=${product.id})}">Order</a>
    </div>
</div>

<!-- Pagination -->
<div class="pagination">
    <a th:href="@{/products?page=0&size=5}">Trang 1</a>
    <a th:href="@{/products?page=1&size=5}">Trang 2</a>
</div>

</body>
</html>
