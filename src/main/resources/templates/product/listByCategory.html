<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm theo danh mục</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="/admincss.css"/>
  <style>
    /* Hiệu ứng xuất hiện (fade-in) */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Hiệu ứng hover (zoom-in) */
    @keyframes zoomIn {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.05);
      }
    }

    /* Container danh sách sản phẩm */
    .product-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    /* Ô sản phẩm */
    .product-item {
      width: 220px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.8s ease-in-out; /* Hiệu ứng xuất hiện */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Hover vào sản phẩm */
    .product-item:hover {
      animation: zoomIn 0.3s ease-in-out forwards;
      box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.2);
    }

    /* Ảnh sản phẩm */
    .product-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.3s ease-in-out;
    }

    /* Hover vào ảnh phóng to */
    .product-item img:hover {
      transform: scale(1.1);
    }

    /* Định dạng chung cho các nút .btn */
    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-size: 16px;
      text-align: center;
      text-decoration: none; /* Loại bỏ gạch chân */
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }

    /* Màu nền các nút tùy theo loại */
    .btn-primary {
      background-color: #007bff;
      color: white;
      border: 1px solid #007bff;
    }

    .btn-success {
      background-color: #28a745;
      color: white;
      border: 1px solid #28a745;
    }

    .btn-warning {
      background-color: #ffc107;
      color: white;
      border: 1px solid #ffc107;
    }

    .btn-danger {
      background-color: #dc3545;
      color: white;
      border: 1px solid #dc3545;
    }

    /* Hover effects cho các nút */
    .btn:hover {
      transform: translateY(-2px); /* Tạo hiệu ứng đẩy lên khi hover */
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); /* Tạo bóng đổ khi hover */
    }

    /* Hover cho các loại nút khác nhau */
    .btn-primary:hover { background-color: #0056b3; }
    .btn-success:hover { background-color: #218838; }
    .btn-warning:hover { background-color: #e0a800; }
    .btn-danger:hover { background-color: #c82333; }

    /* Thêm khoảng cách giữa các nút */
    .btn + .btn {
      margin-left: 10px;
    }

    /* Nút "Quay lại danh mục" */
    .back-link {
      background-color: #f8f9fa;
      color: #007bff;
      border: 1px solid #007bff;
    }

    .back-link:hover {
      background-color: #e2e6ea;
    }
  </style>
</head>
<body>
<div th:replace="~{fragments/userheaded :: header}"></div>
<div class="container">
  <h1>Sản phẩm trong danh mục: <span th:text="${category.name}"></span></h1>

  <div class="product-list">
    <div th:each="product : ${products}" class="product-item" th:if="${!product.isDeleted}">
      <img th:src="@{'/uploads/images/' + ${product.imageName}}" alt="Hình ảnh sản phẩm" />
      <div class="product-info">
        <h2 th:text="${product.name}"></h2>
        <p><strong>Giá:</strong> <span th:text="${product.price}"></span> VND</p>
        <p><strong>Số lượng:</strong> <span th:text="${product.quantity}"></span></p>
        <p>
          <span th:if="${product.isOutOfStock}" class="badge bg-secondary">Ngưng bán</span>
          <span th:if="${!product.isOutOfStock}" class="badge bg-success">Đang bán</span>
        </p>
      </div>
      <div class="product-actions">
        <a th:href="@{/product-details/{id}(id=${product.id})}" class="btn btn-primary">Chi tiết</a>
        <a th:href="@{/products/toggle-outofstock/{id}(id=${product.id})}"
           class="btn" th:classappend="${product.isOutOfStock ? 'btn-success' : 'btn-warning'}">
          <span th:if="${product.isOutOfStock}">Bán lại</span>
          <span th:if="${!product.isOutOfStock}">Ngưng bán</span>
        </a>
        <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-primary">Chỉnh sửa</a>
        <a th:href="@{/products/delete/{id}(id=${product.id})} "
           onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');"
           class="btn btn-danger">Xóa</a>
        <!-- Nút Order - Chỉ hiển thị nếu sản phẩm đang bán -->
        <a th:if="${!product.isOutOfStock}"
           th:href="@{/shoppingcart/ordernow/{id}(id=${product.id})}"
           class="btn btn-success">
          Order
        </a>
      </div>
    </div>

  </div>
</div>
<a href="/products/create" class="btn btn-primary">Thêm Sản Phẩm</a>
<a class="back-link btn btn-primary" href="/categories/list">Quay lại danh mục</a>
<div th:replace="~{fragments/userFooter :: footer}"></div>
</body>
</html>
