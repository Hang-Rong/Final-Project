<!DOCTYPE html>
<html>
<head>
    <title>Thông tin khách hàng</title>
</head>
<body>
<h2>Thông tin cửa hàng</h2>
<p><strong>Tên chủ quán:</strong> <span th:text="${customer.name}"></span></p>
<p><strong>Email:</strong> <span th:text="${customer.email}"></span></p>
<p><strong>Địa chỉ:</strong> <span th:text="${customer.address}"></span></p>
<p><strong>Số điện thoại liên hệ :</strong> <span th:text="${customer.phone}"></span></p>

</body>
</html>
