<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin khách hàng</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/admincss.css"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .customer-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        h2 {
            color: #007bff;
            margin-bottom: 20px;
        }

        .customer-info p {
            font-size: 16px;
            margin: 10px 0;
        }

        .customer-info strong {
            color: #333;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/userheaded :: header}"></div>

<div class="customer-card">
    <h2>Thông tin cửa hàng</h2>
    <div class="customer-info">
        <p><strong>Tên chủ quán:</strong> <span th:text="${customer.name}"></span></p>
        <p><strong>Email:</strong> <span th:text="${customer.email}"></span></p>
        <p><strong>Địa chỉ:</strong> <span th:text="${customer.address}"></span></p>
        <p><strong>Số điện thoại liên hệ:</strong> <span th:text="${customer.phone}"></span></p>
    </div>
    <a href="/admin" class="btn">Quay lại</a>
</div>

<div th:replace="~{fragments/userFooter :: footer}"></div>

</body>
</html>
